<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js + TypeScript + Tailwind Starter</title>
  </head>
  <body>
    <div id="app">
      <canvas id="three-canvas" aria-label="Interactive 3D scene"></canvas>

      <main class="pointer-events-none fixed inset-0 z-10 flex items-start justify-between p-6">
        <section class="pointer-events-auto max-w-sm rounded-2xl border border-white/15 bg-black/45 p-5 text-white shadow-2xl backdrop-blur-md">
          <p class="text-sm uppercase tracking-[0.35em] text-sky-200/80">Starter Scene</p>
          <h1 class="mt-2 text-3xl font-semibold">Three.js Cube</h1>
          <p class="mt-3 text-sm leading-6 text-white/75">
            Drag to orbit, scroll to zoom. These controls are plain HTML layered over the 3D canvas.
          </p>
        </section>

        <nav class="pointer-events-auto flex gap-3">
          <button class="ui-button" type="button">About</button>
          <button class="ui-button" type="button">Action</button>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
